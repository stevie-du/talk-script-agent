# 完工案例库
#
# 案例是转化率最高的素材 —— 具体的小区、台量、时间，比任何形容词都有说服力。
#
# ⚠️ 填之前确认：项目名称是否允许对外提及？
#    public: false 的条目，脚本中只写"XX市某小区"，不出现真实名称。

cases:
  - project: "示例：XX花园加装电梯"
    city: ""
    district: ""               # 区/县，可选
    year: 2025
    type: "加装"                # 加装 / 新装 / 整机更新 / 改造 / 维保托管
    units: 12                  # 台量
    floors: ""                 # 楼层
    model: ""                  # 使用型号
    challenge: ""              # 难点，例：底坑受限、管线复杂、一二楼协调
    solution: ""               # 怎么解决的
    result: ""                 # 结果，尽量量化，例：三个月完成，一次验收通过
    public: true               # 是否可对外提及真实项目名称
    source: ""
    verified: ""

  # 复制上面这一段继续添加，建议先填 5~10 个

# ── 案例使用规则 ──────────────────────────
usage_rules:
  - public 为 false 时，脚本中用"XX市某小区"代替真实名称
  - 案例必须真实，不得虚构台量、年份、小区名
  - 涉及具体数据时，脚本中需保留可核查性
  - 竞品替换场景的案例，不得点名原品牌
