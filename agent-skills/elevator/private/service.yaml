# 服务承诺库
#
# ⚠️ 这个文件的每一条都可能被直接写进脚本并对外发布。
#    只填你**确实做得到、且愿意白纸黑字承诺**的内容。
#    做不到的不要写 —— 承诺兑现不了比不承诺伤害大得多。
#
# 填写原则：能写数字就别写形容词

# ── 响应时效 ──────────────────────────────
response:
  trapped_minutes:            # 困人救援到达时间（分钟）
  fault_hours:                # 一般故障到达时间（小时）
  routine_hours:              # 常规维保响应（小时）
  hotline: ""                 # 24 小时热线（确认可公开才填）
  note: ""                    # 例：市区范围内，远郊另计

# ── 质保与承诺 ────────────────────────────
warranty:
  whole_machine_months:       # 整机质保期（月）
  main_parts_months:          # 主要部件质保期（月）
  scope: ""                   # 质保范围说明
  exclusions: ""              # 不保范围（易损件、人为损坏等）

# ── 服务覆盖 ──────────────────────────────
coverage:
  cities: []                  # 例：["XX市", "XX市"]
  service_stations:           # 服务网点数量
  engineers:                  # 持证维保人员数量
  note: ""

# ── 维保服务内容 ──────────────────────────
maintenance:
  cycle: "半月 / 季度 / 半年 / 年度"   # 按 TSG T5002 表述
  includes:
    - "清洁、润滑、检查、调整、更换易损件"
  record_method: ""           # 例：电子工单 + 纸质记录双留痕
  report: ""                  # 是否提供维保报告、频次

# ── 资质 ──────────────────────────────────
qualifications:
  - ""                        # 例：特种设备生产许可证（含安装、改造、修理）
  - ""                        # 例：ISO9001

# ── 备件 ──────────────────────────────────
spare_parts:
  stock: ""                   # 常用备件库存情况
  delivery: ""                # 非常用件到货周期

# ── 可用于脚本的"硬证据"────────────────────
# 这一节最值钱：写具体、可验证、有画面感的事实，不要写形容词
evidence:
  years_in_business:          # 从业年限
  total_units:                # 累计服务台量
  projects_count:             # 完工项目数
  other:
    - ""

source: ""
verified: ""
