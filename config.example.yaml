# TalkScript 引擎配置（模板）
#
# ⚠️ 一般**不需要手动复制这个文件**：引擎首次运行会在数据目录自动生成一份
#    带同样注释的 config.yaml（打包版是 %APPDATA%\TalkScript\，开发态是项目根）。
#    也可以在应用内「设置 → 模型接口」里填，效果相同。
#    本文件留在仓库里，是为了让不运行程序的人也能看到配置项。
#
# 安装包**不携带任何 config**（连模板都不带）—— 用户自己配置。
# config.yaml 已被 .gitignore 忽略（它含明文 API Key，不入库）。
#
# api_key 也可用环境变量 TALKSCRIPT_API_KEY 提供（不落盘）
# 开发调试可设 TALKSCRIPT_MOCK=1 跑通流程（不调模型）
llm:
  base_url: https://open.bigmodel.cn/api/paas/v4   # 任意 OpenAI 兼容接口
  api_key: ""                                      # ← 在这里填你的 Key
  model: glm-4.7
  temperature: 0.7
  retries: 2        # 请求失败（网络/超时/429/5xx）自动重试次数；0 = 不重试
  timeout: 180      # 单次请求超时（秒）；长输出模型可调大
  max_tokens: 16000 # 单次输出预算。推理型模型（deepseek 系等）的「思考」token
                    # 也计入这里，给太小会导致 content 返回空串。遇到
                    # 「模型返回了空内容」或 JSON 解析失败，优先调大这一项。

default_pack: elevator
