# 人味 tell 词表（app/ai_tells.py 读本文件）
#
# 这是**行业无关的起点词表**（书面连接词、口号收尾、排比/清单体…）。
# 新包带着它出生：删掉本文件 = 这个人味检测在新包里静默关闭
# （`Pack.ai_tells_data()` 找不到文件就返回 None，报告里 `ai_tells` 落 null，
# 界面上不会有任何提示）。要按行业补词，直接往 lexicon 里加。
# ⚠ 加词之前先读 `docs/技能包制作指南.md` 的 §10「词表维护纪律」：
#   新词必须过 A-3 误报回归 + `generated/` 分布复跑；**误报超线的条目整条撤下**，
#   不是把阈值调高（调高阈值等于把尺子换成一把更钝的，而报告看不出区别）。
#
# 与 banwords.yaml 的分工：这里管**像不像人说话**，不管合不合规。
# 命中**不进 passed 判定** —— 一把没校准过的尺子不该拦发布
# （banwords 的 soft 当年 169/175 轮假命中就是这条教训）。
#
# tell 名必须是引擎认识的那 14 个（写错了引擎会把它报成 config_warnings，
# 而不是静默不跑）：
#   结构类 parallel_triple 排比三连 · list_enumeration 清单体递增
#         uniform_para_len 每段等长 · repeat_opening 句首重复 · no_specific 通篇零具体
#         contrast_frame 对照反转（「不是…而是…」，句式在代码里，本文件不用配词）
#   词表类 bookish_connective 书面连接词 · abstract_noun_ending 抽象名词尾
#         slogan_closing 口号收尾 · opening_ban 开场禁区 · filler_stack 堆词
#         unattributed 无来源归因 · cliche_hook 悬念互动套路 · helper_closing 助手腔收尾
# 没列在这里的 tell 名 = 引擎不跑（默认关，而不是默认开）。
# ⚠ 但"默认关"只在**包自己**这一层成立：`tests/test_aitells_alignment.py` 要求
#   每个包声明的 tell 集合与需求方案 §2.1 **完全相等**，所以加一条 tell 是
#   三处一起动（引擎 + §2.1 表 + 全包 yaml），不存在"先声明了但不跑"的中间态。
strong:
  - no_specific          # 通篇没有一个具体数字/时间：voice.md 自己标为最致命
  - slogan_closing       # 口号式收尾出现即问题
  - opening_ban          # 「大家好今天聊」这类模板开场出现即问题
  - helper_closing       # 助手腔收尾同样"出现即问题"：它不是密度问题，是对话对象错了
                         #   （「希望对你有帮助」是对**读者**念稿而不是对**观众**说话）。
                         #   为什么不用 weak：weak 的语义是"段内 ≥2 才报"（`WEAK_MIN`），
                         #   而这类收尾一篇就一句 —— 那条 tell 会永不响。
weak:
  - parallel_triple
  - list_enumeration
  - uniform_para_len
  - repeat_opening
  - bookish_connective
  - abstract_noun_ending
  - filler_stack
  - contrast_frame       # 段内 ≥2 处「先立后破」对照句式才报（口径见 §2.1）
  - unattributed         # 「研究表明」这类无出处归因；下文 20 字内有数字/文号则豁免
  - cliche_hook          # 「99%的人不知道/看到最后/建议收藏」—— 段内 ≥2 才是"排队"

# 词表类 tell 的取词。两个约束：
#   1. 单字收不住（引擎按 len>=2 过一遍，与 banwords 的 MIN_WORD_LEN 同口径）；
#   2. 词表内互不重叠，同一位置只算最长那个（见 _scan_words）——
#      所以**不要**在同一家族里同时写「普遍认为」与「专家普遍认为」，
#      短的那个永远取不到（对账测试 `test_lexicon_words_satisfy_scan_words_preconditions`
#      会把这种写法判成缺陷）。
# 条目的三种形态（引擎 `_lex_entry` 都认）：
#   - 闭环                              纯词
#   - {闭环: 仅黑话义}                   词 + 给人读的限定说明（跟着命中进回炉反馈）
#   - {闭环: {note: 仅黑话义,            词 + 说明 + 机器可判的豁免：命中处撞上
#              unless: [流程闭环]}}      这些短语就放过（行业真术语不是黑话）
# `re:` 前缀的正则条目**只有 opening_ban（first_sent）那条路认**，用在别的类里会被
# 引擎报进 config_warnings 并跳过 —— `_scan_words` 是字面量匹配，正则当词用
# 得到的是一条"看着配了、永不命中"的死词。
lexicon:
  bookish_connective:
    - 综上所述
    - 总而言之
    - 与此同时
    - 在此基础上
    - 值得一提的是
    - 不难发现
    - 显而易见
    - 由此可见
    - 另一方面
    - 首先
    - 其次
    - 最后
    # A-9 扩词（调研报告-20260928 §四）：第二道防线。A-8 已证"收词对当前产物零影响"，
    # 这批防的是别的包 / 别的模型版本把提示词那一道堵住的情况。
    - 一言以蔽之
    - 不可否认
    - 从某种程度上来说
    - 在这个过程中
  abstract_noun_ending:
    # 单字后缀（性/度/化）不收：引擎按 len>=2 过一遍，写了也不匹配，
    # 只会得到一个永远为 0 的 tell。要拦就写成具体的抽象名词。
    - 高效性
    - 安全性
    - 便利性
    - 舒适性
    - 体验度
    - 智能化
    - 规范化
    - 标准化
    - 专业化
    # A-9：通用 AI 黑话（不是行业词 —— 本文件可以收"任何行业都听得腻"的那批）。
    # ⚠ 不写「价值闭环 / 全方位赋能」：那会让「闭环 / 赋能」成为它们的子串而永远取不到。
    - 赋能
    - 抓手
    - 底层逻辑
    - 顶层设计
    - 核心竞争力
    - 深度剖析
    - 多维度
    - 能力沉淀
    # 词义限定的写法示例 —— `unless` 里的短语请换成**本行业的真术语**：
    # 命中处撞上它们就放过（那是行话，不是黑话）。
    - 闭环:
        note: 仅黑话义（「形成闭环」式收尾）
        unless: [流程闭环, 订单闭环]
  filler_stack:
    # 「其实」同时是**正向口语词**（voice.md 的"多用词"清单里有「其实呢」），
    # 只罚连着堆的形态：撞上「其实呢」就豁免。提示词鼓励、判据又扣分的词，
    # 必须把两边口径对齐（A-9 审查 P2）。
    - 其实:
        note: 堆在一起才算；「其实呢」是口语标记，不罚
        unless: [其实呢]
    - 真的
    - 非常
    - 特别
    - 一般来说
    - 通常情况下
    - 众所周知
    # A-9 扩词
    - 总的来说
    - 毋庸置疑
    - 事实上
    - 需要注意的是
    - 此外
    - 不得不说
  slogan_closing:
    - 让生活更美好
    - 为你保驾护航
    - 值得拥有
    - 选择没错
    - 品质保证
  opening_ban:
    - 大家好
    - 今天我们来聊
    - 今天给大家
    - 本期视频
    - 话不多说
    # A-9 开场套路：「框架」类枚举不完中间的字，所以走 `re:`（只在本类有效）
    - 先纠正一个误区
    - 很多人以为
    - "re:在当今[\\s\\S]{0,12}(?:时代|社会|背景下)"
    - "re:随着[\\s\\S]{0,16}的(?:发展|普及|兴起|深入)"
    - "re:作为一[个名位]"
  unattributed:
    # A-9 新 tell：无来源归因。⚠ 引擎自带出处豁免 —— 命中后 20 字内出现具体数字 /
    # 「数词+量词」就放过：「市场监管总局数据显示，2025 年…」是真归因，不是空口白话。
    - 研究表明
    - 数据显示
    - 调查表明
    - 普遍认为
    - 有专家指出
    - 业内一致认可
    - 业内人士
  cliche_hook:
    # A-9 新 tell：悬念 / 互动套路。**段内 ≥2** 才报 —— 这类"口号排队"的本义就是
    # 多个连用；单独一句「建议收藏」是正常口播用语。
    - 99%的人不知道
    - 看到最后
    - 建议收藏
    - 赶紧码住
    - 学会这招
    - 别划走
    - 手把手教
    - 必看
  helper_closing:
    # A-9 新 tell：助手腔收尾 —— 对着**读者**念稿而不是对**观众**说话（对话对象错置）。
    # 作用域是 `cta_strict`（只看结尾引导段、**不做**第二人称豁免）：套 `cta_only`
    # 那条豁免，「希望对你有帮助」这种本身含"你"的短语会被恒豁免、tell 永不响。
    # ⚠ 只收**书面 / 助手**腔的套语：曾收「如果你也」「评论区告诉我」，实测那是口播
    #   的正常互动收尾（一句就能被判 strong×2、人味 76 分）—— 判据不能罚人话，已删。
    - 希望对你有帮助
    - 希望本文
    - 欢迎在评论区
    - 我可以进一步展开

# 门槛的按包覆盖（A-9 schema #2）。**默认不写 = 引擎的 `WEAK_MIN`（2）**。
# ⚠ 只有 **weak 的词表类**与 **`contrast_frame`** 吃这个覆盖：strong 是"单次即报"，
#   其余结构类各有自己的判据（≥3 项并列 / 递增 ≥4 句 / cv<0.15 / 句首 >1/3），
#   给它们写门槛会被引擎报成 **no-op** 并忽略 —— 别以为尺子换了。
# 真正生效的非默认值会在 `config_warnings` 里说出口："非默认口径，分数与别的包不可比" ——
# 因为这个数直接决定扣分面，必须和 `score_of()` 一起看。示例（保持注释状态）：
# thresholds:
#   cliche_hook: 3
#   contrast_frame: 3

# L2 形态面板的**成语密度**用表（`AITells.shape_metrics`）。与 lexicon 的分工一样：
# 表在包里，代码里一个具体词都不写。
# ⚠ 这是一份**起点样本表**，不是成语词典：这一列只喂 L2 的"参考指标"，
#   不参与分数、不参与 `passed`（`score_of()` 看不见它）。要扩请先按
#   `docs/技能包制作指南.md` §10.3 的纪律
#   跑 A-3 与产物分布，看密度这条在口语基线上到底分不分得开（§3.5 的告诫：
#   口语体天然低多样性，别拿书面语阈值来判）。
idioms:
  - 至关重要
  - 不言而喻
  - 一目了然
  - 一如既往
  - 不容忽视
  - 不可或缺
  - 相得益彰
  - 行之有效
  - 潜移默化
  - 任重道远
  - 源远流长
  - 丰富多彩
  - 水到渠成
  - 循序渐进
  - 有的放矢
  - 面面俱到

