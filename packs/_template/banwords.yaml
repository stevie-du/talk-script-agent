# 禁用词表（模板包 · 只含**与行业无关**的广告法与平台通用词）
#
# 建包时 `app/packgen.py` 把这份表复制进新包，再并入模型给的行业增补词。
# ⚠ 往这里加**任何行业专属词**（某行业的装置名、监管号码、特定资质）都是回归 ——
#   那些词属于各包自己的 banwords.yaml，模板包一份都不该有。
#
# hard  : 命中必改（明确违规）
# soft  : 命中待人工确认（语境相关，可能是正常用法）
# platform :
#   promote   : 该平台上由 soft 升级为 hard
#   demote    : 该平台上由 hard 降级为 soft
#   extra_hard: 该平台追加的 hard 词
#   ⚠ 没有 extra_soft：写了不报错，但引擎不读（app/checker.py 只认上面三种）
#
# 依据：compliance/ad-law.md（广告法）、compliance/platform.md（平台规则）。

version: 1
updated: 模板包（行业增补词见各包自己的 banwords.yaml）

hard:
  # ── 绝对化断言（广告法 + 无法验证）──
  - 绝对安全
  - 100%安全
  - 零事故
  - 零故障
  - 永不故障
  - 终身免费
  - 终身不出问题
  - 出事包赔
  - 伤亡全赔
  - 万无一失
  - 零风险
  - 零缺陷
  - 零失败
  - 无副作用
  - 全部有效
  - 根治

  # ── 极限价格/排名断言 ──
  - 全网最低
  - 全网最低价
  - 全市最低
  - 史上最低
  - 史上最强
  - 行业之最
  - 性价比最高

  # ── 权威虚假背书（冒用政府/媒体/检测机构）──
  - 政府扶持
  - 政府补贴
  - 政府给钱
  - 官方补贴
  - 官方认证
  - 官方唯一授权
  - 央视推荐
  - 央视上榜
  - 政府专供
  - 特供
  - 国宴专用
  - 驰名商标
  - 质量免检
  - 国家级检测认证

  # ── 无法兑现的承诺 ──
  - 包过
  - 保过
  - 保证通过
  - 包拿证
  - 无效退款
  - 假一赔十

  # ── 诱导互动 ──
  - 一键三连
  - 求点赞
  - 求关注
  - 求收藏
  - 互关互赞
  - 刷赞
  - 点亮小红心
  - 上热门
  - 必火
  - 涨粉神器

  # ── 站外导流 ──
  - 加微信
  - 加微
  - 私聊
  - 私信我
  - 加我
  - 二维码
  - 进群

  # ── 利诱与虚假福利 ──
  - 免费送
  - 零元领
  - 红包雨
  - 稳赚
  - 躺赚
  - 必赚

  # ── 虚假营销 ──
  - 清仓倒闭
  - 老板跑路
  - 跳楼价
  - 亏本甩卖

  # ── 法律定性 / 恐吓（各包通用的雷区：拿不准的定性不要说）──
  #   「X是违法」的两种口语写法都要列：只列前者会漏掉"还在用，就是在违法"这种句式。
  - 就是违法
  - 是在违法
  - 属于违法
  - 判赔
  - 坐牢

soft:
