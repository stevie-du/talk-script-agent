  - 极致
  - 极品
  - 终极
  - 殿堂级
  - 国家级
  - 世界级
  - 首选
  - 首家
  - 独家
  - 独一无二
  - 仅此一家
  - 全球首发
  - 冠军
  - 领先
  - 领跑者
  - 无敌
  - 完美
  - 天花板
  - 尖端
  - 王牌
  - 龙头
  - 行业龙头
  - 独占市场
  - 绝无仅有
  - 史无前例
  - 无与伦比
  - 性价比之王
  - 填补行业空白
  - 最安全
  - 最先进

  # ── 逼单话术（真实活动并写明日期可用，故为待确认）──
  - 马上涨价
  - 最后一天
  - 仅限今天
  - 错过再等一年
  - 不买就亏
  - 不买吃亏
  - 错过后悔
  - 再不抢没了
  - 手慢无
  - 抢爆
  - 疯抢
  - 万人秒杀

  # ── 需证据的背书 ──
  - 专家推荐
  - 明星同款

  # ── 法律定性（拿不准、语境相关的）──
  - 追究责任

  # ── 「X第一」带限定词（裸"第一"误伤已删）──
  - 全网第一
  - 全国第一
  - 销量第一
  - 行业第一
  - NO.1
  - TOP1
  - 仅此一款

  # ── 广告法其余词 ──
  - 彻底
  - 无瑕
  - 永不反弹
  - 领导者

platform:
  抖音:
    demote:
      - 私信我        # 站内私信引导属正常用法
  小红书:
    demote:
      - 私信我        # 站内私信用于正常咨询；平台严查的是站外导流（见 extra_hard）
    extra_hard:
      - 微信
      - VX
      - 手机号
      - 私信领取
      - 资源分享
      - 主页找我
      - 闭眼入
      - 人手必备
      - 全民种草
  视频号:
    extra_hard:
      - 绝对正确
      - 百分百靠谱
      - 唯一真相
      - 辟谣所有
      - 史上最全
      - 无限领取
  B站:
    demote:
      - 一键三连
      - 求点赞
      - 求关注
      - 求收藏
      - 私信我
