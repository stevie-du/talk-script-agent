# 模板包（`packs/_template/`）—— 行业包生成器的骨架来源
#
# 这个包**不代表任何行业**：`app/packgen.py` 建包时从这里的 GENERIC_FILES /
# PRIVATE_TEMPLATES 复制骨架，再由模型填入新行业的知识。
# 因此本包的每一句话都必须与具体行业无关 —— 出现任何一个行业的名字或事实就是回归
# （钉在 tests/test_template_pack.py）。
#
# 为什么需要它（P0）：以前 `TEMPLATE_PACK` 找不到 `_template` 就静默回退到某个
# 成熟行业包，于是新建的行业包里带着**那个行业**的 patterns/growth.md（标题就写着
# 是某行业特有的取舍）与填好的 private/faq.yaml —— 这两份**每轮撰写都注入**，
# 模型收到的完播建议与"私有事实"全是别行业的。现在模板缺失直接抛错，不再回退。
#
# 名称以下划线开头 → `list_packs` 跳过它（引擎内部骨架，不是一份可选的行业包）。

name: _template
display_name: 模板包（不注入任何行业）
draft: false
version: 1
description: 行业包生成器的中立骨架：无行业事实，仅供 packs/ 建包时复制

params:
  segment:
    label: 细分领域
    options: ["{{细分一}}", "{{细分二}}"]
    default: "{{细分一}}"
  audience:
    label: 受众
    options: ["{{受众一}}", "{{受众二}}"]
    default: "{{受众一}}"
  duration:
    label: 时长（秒）
    options: [15, 30, 60, 90, 180]
    default: 60
  style:
    label: 风格
    options: [权威科普, 亲和接地气, 幽默玩梗, 严肃警示, 销售转化]
    default: 亲和接地气
  platform:
    label: 平台
    options: [抖音, 视频号, 小红书, B站]
    default: 抖音
  persona:
    label: 人设
    options: ["{{人设一}}", "{{人设二}}"]
    default: "{{人设一}}"
  cta:
    label: 结尾引导
    options: [关注, 私信, 留资, 到店, 评论关键词]
    default: 关注
  # 回炉改写范围三档（见 app/knowledge.py 的 REWRITE_SCOPES）。与行业无关，
  # 新包直接沿用；真要覆盖，改 options/default 即可（写错档位名会被判成坏包）。
  rewrite_scope:
    label: 改写范围
    options: [in-place, bounded, structural]
    default: bounded

# 语速与配额是「口播」这件事的物理量，与行业无关，直接沿用（新包会复制这些表）。
rate_by_style:
  权威科普: 4.5
  亲和接地气: 4.5
  幽默玩梗: 5.0
  严肃警示: 4.2
  销售转化: 5.0

# 字数配额表（基准语速 5.0 字/秒；其他语速按 rate/5.0 折算，见 rules/duration.md）
quota_table:
  # ⚠ 15 秒档的形状是「钩子重、引导轻」：cta 15 字 ≈ 3.2 秒，一条 15 秒的片子
  #   要花五分之一时间念 CTA，而正文只剩 40 字（8 秒）说不完一件事。
  #   短档把引导压到 8 字，省下的字数全部还给正文（60 秒及以上不动，
  #   长片有空间铺陈引导）。与 packs/elevator/pack.yaml 同一口径 ——
  #   这个模板是 packgen 的骨架，**新包会原样继承这里的形状**。
  15:  { total: 70,  hook: 15, body: 47,  cta: 8 }
  30:  { total: 145, hook: 25, body: 90,  cta: 30 }
  60:  { total: 290, hook: 45, body: 190, cta: 55 }
  90:  { total: 430, hook: 60, body: 300, cta: 70 }
  180: { total: 820, hook: 90, body: 600, cta: 130 }

points_by_duration:
  15: 1
  30: 2
  60: 3
  90: 3
  180: 4

# 模板包没有 knowledge/topics.md 与 audience.md（这两份由模型按新行业生成），
# 所以映射表留空：pack_info/param_audit 对模板包不做章节对账。
topics_map: {}
audience_map: {}

files:
  private: [private/products.yaml, private/service.yaml, private/cases.yaml, private/faq.yaml]

banwords: banwords.yaml

# ── 情报源（需求方案 §2.2）──────────────────────────────────────
# 新包带着这一份出生：**选题页的分区、筛选行 chip、左栏计数、情报源表四处
# 都由它渲染**，删掉它 = 这个包没有"今日选题"可看。
# `id` 是引擎侧适配器名（app/intel.py 的 ADAPTERS），可用的有：
#   demand_terms 下拉词（雷达，最有效） · bilibili_search B站同类（供给度量）
#   hot_board 热榜（破圈触发器，按 params.board 出抖音/头条/知乎多个源）
#   policy_library 政策库（口径库，给可引的文号） · manual_import 人工导入
# 节奏（cadence）各源自己定：daily / weekly / monthly / quarterly / on_demand。
# 没有公开检索口的平台就 `enabled: false` + 一句 `note` 说明为什么 ——
# 「这个平台我们不做」要是一个**可见的决定**，而不是"界面上没有它"。
intel_sources:
  - id: demand_terms
    label: 下拉词
    platform: 百度/必应
    role: 雷达
    cadence: daily
    note: 搜索联想词 diff，种子取本包的细分领域
  - id: bilibili_search
    label: B站同类
    platform: B站
    role: 供给度量
    cadence: on_demand
    note: 同题条数越多越红海；计数只当相对值
  - id: hot_board
    label: 抖音热榜
    platform: 抖音
    role: 破圈触发器
    cadence: daily
    params: { board: douyin, match: keyword }
    note: 只做关键词命中；命中 0 是正常结果
  - id: policy_library
    label: 政策库
    platform: 国务院
    role: 口径库
    cadence: quarterly
    note: 不是雷达是口径库：它给的是可引的文号与条款
  - id: manual_import
    label: 人工导入
    platform: 本地
    role: 数据源
    cadence: on_demand
    note: 拿不到的平台贴链接或导 CSV，落 data_dir/intel/<pack>/manual/
