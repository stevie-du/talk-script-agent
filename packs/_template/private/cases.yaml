# 案例库（模板包骨架 · 当前为空）
#
# 案例是转化率最高的素材 —— 具体的时间、地点、数量，比任何形容词都有说服力。
#
# ⚠️ 填之前确认：客户/项目名称是否允许对外提及？
#    public: false 的条目，脚本中只写"某地某客户"，不出现真实名称。
#
# 模板包**故意不放任何案例**（连占位示例都不放）：整条目级的示例剔不掉，
# 会以"真案例"的名义每轮注入模型，模型再据此编出交付业绩。
# 有真实项目后按下面的结构各加一条，数字必须真实可核查。

cases: []

# ── 案例结构（复制这一份去填，填完删掉本注释块）──────────────
# cases:
#   - title: ""               # 一句话说明做了什么
#     client_type: ""         # 客户类型（不写真实名称，除非 public: true）
#     scope: ""               # 范围 / 数量（带单位）
#     duration: ""            # 周期
#     outcome: ""             # 可核查的结果（不要写"客户非常满意"）
#     public: false
#     source: ""
#     verified: ""

# ── 案例使用规则（这些规则是给**人**看的，不要写成 YAML 值）───────
# 引擎把本文件里所有非空条目当作"既成事实"注入模型（【私有知识库（优先作为事实来源）】），
# 所以规则类文字一律留在注释里；写进值里，模型会把它当成一条案例来引用。
#   · public 为 false 时，脚本中用"某地某客户"代替真实名称
#   · 案例必须真实，不得虚构数量、年份、客户名
#   · 涉及具体数据时，脚本中需保留可核查性
#   · 竞品替换场景的案例，不得点名原品牌
