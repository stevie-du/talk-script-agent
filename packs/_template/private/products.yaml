# 产品 / 服务标的库（模板包骨架 · 全部留空）
#
# 填写说明：
#   1. 带单位的必须写单位（kg / m / 元 / 天）
#   2. 不确定就留空，不要用估计值 —— 留空的字段引擎会剥掉，不注入模型
#   3. 每项填完更新 verified 日期
#   4. 用不到的分组整段删掉；**不要留"示例：xxx"的半成品条目**
#      （字符串叶子会被剥，但整条目级的示例剔不掉，会以【私有知识库（优先作为事实来源）】
#       的名义每轮注入模型）
#
# ⚠ 模板包故意**不预填任何数字**：这些字段一旦带上"很像真"的示例值，
#   就会被下一个行业当成自己的事实写进脚本（历史教训见 docs 指南 P0-17）。

items:
  - name: ""                  # 产品/服务名称
    spec: ""                  # 关键规格或范围
    price_note: ""            # 只写计价逻辑，不写底价
    highlights:               # 卖点，每条要能落到具体凭证或数据
      - ""
    applicable: ""            # 适用场景 / 人群
    source: ""                # 资料名（如"2026 版说明书第 4 章"）
    verified: ""              # 你核过的日期
