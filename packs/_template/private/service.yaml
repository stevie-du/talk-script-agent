# 服务承诺库（模板包骨架 · 全部留空）
#
# ⚠️ 这个文件的每一条都可能被直接写进脚本并对外发布。
#    只填你**确实做得到、且愿意白纸黑字承诺**的内容。做不到的不要写。
#    每条承诺必须与 `compliance/industry.md` 的红线口径一致 ——
#    本文件写"多久到场"，红线文件管"能不能这么说"。
#
# 填写原则：能写数字就别写形容词；数字必须可核查，并更新 verified 日期。

# ── 响应时效 ──────────────────────────────
response:
  urgent:                     # 紧急场景到达时限（分钟/小时，按本行业口径）
  normal:                     # 一般问题响应时限
  routine:                    # 常规服务响应时限
  hotline: ""                 # 对外热线（确认可公开才填）
  note: ""                    # 范围说明：哪些区域不适用

# ── 质保与承诺 ────────────────────────────
warranty:
  whole_months:               # 整体质保期（月）
  parts_months:               # 主要部件质保期（月）
  scope: ""                   # 质保范围说明
  exclusions: ""              # 不保范围（易损件、人为损坏等）

# ── 服务覆盖 ──────────────────────────────
coverage:
  cities: []
  stations:                   # 网点数量
  staff:                      # 可投入的人员数量（须与资质口径一致）
  note: ""

# ── 常规服务内容 ──────────────────────────
routine_service:
  cycle: ""                   # 周期照 compliance/industry.md 的口径写，不要自造说法
  includes:
    - ""
  record_method: ""           # 留痕方式（电子工单 / 纸质签收等）
  report: ""                  # 是否出报告、频次

# ── 资质（只写许可证的类别与覆盖范围，不写"什么都能干"）──
qualifications:
  - ""

# ── 备件 / 物料 ───────────────────────────
supplies:
  stock: ""
  delivery: ""

# ── 可用于脚本的"硬证据" ──────────────────
# 这一节最值钱：写具体、可验证、有画面感的事实，不要写形容词。
# ⚠ 别填"从业十几年""服务过 X 万台"这类无法核实的自证 —— 钩子库与红线都不允许。
evidence:
  other:
    - ""

source: ""
verified: ""
