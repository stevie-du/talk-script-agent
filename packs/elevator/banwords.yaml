  #   只加「有把握的长短语」，避免误伤正常用语（拿不准的放 soft 再人工定）。
  #   「是在违法」是原钩子范文里的写法（"还在用，就是在违法"）—— 只列
  #   「就是违法」拦不住它，实测 scan() 命中 0。
