# 行业包清单（引擎按此文件加载与归一参数）
#
# pack 是自包含的可分发单元：一个目录 = 一个行业，
# 分享给同事 = 复制目录（不含 private/ 即不带商业信息）。
# 向导生成的包结构与此文件同 schema。

name: elevator
display_name: 电梯
draft: false          # true 时界面显示"草稿·需人工校对"角标
version: 1
description: 电梯/扶梯/加装/维保行业口播脚本知识包

params:
  segment:
    label: 细分领域
    options: [整机改造, 维保, 旧楼加装, 家用电梯, 扶梯, 零部件, 检验检测, 行业观察]
    default: 维保
  audience:
    label: 受众
    options: [业主乘客, 物业业委会, 维保公司, 开发商总包, 经销商渠道]
    default: 业主乘客
  duration:
    label: 时长（秒）
    options: [15, 30, 60, 90, 180]
    default: 60
  style:
    label: 风格
    options: [权威科普, 亲和接地气, 幽默玩梗, 严肃警示, 销售转化]
    default: 亲和接地气
  platform:
    label: 平台
    options: [抖音, 视频号, 小红书, B站]
    default: 抖音
  persona:
    label: 人设
    options: [维保老师傅, 产品经理, 行业观察者, 物业主管]
    default: 维保老师傅
  cta:
    label: 结尾引导
    options: [关注, 私信, 留资, 到店, 评论关键词]
    default: 关注
  # A-2：回炉改写的范围三档（见 app/knowledge.py 的 REWRITE_SCOPES 与
  # pipeline.SCOPE_INSTRUCTION）。**不是"生成方式"，是"改稿时允许动多大"**：
  #   in-place   只句内换词，不删句/不加句/不换段落顺序（事实与占位一个字符不动）
  #   bounded    默认档：按点名的几条逐处改，不另起一炉、不动未点名的段落
  #   structural 允许合并/拆分/重排段落（改得动，但最容易矫枉过正）
  # 没配这一项 = 走 bounded。写错档位名会在包列表上直接标成不可用（不静默退回默认）。
  rewrite_scope:
    label: 改写范围
    options: [in-place, bounded, structural]
    default: bounded

# 语速（字/秒）按风格自动选
rate_by_style:
  权威科普: 4.5
  亲和接地气: 4.5
  幽默玩梗: 5.0
  严肃警示: 4.2
  销售转化: 5.0

# 字数配额表（基准语速 5.0 字/秒；其他语速按 rate/5.0 折算，见 rules/duration.md）
#
# ⚠ 每档四个数字必须相加成立（total = hook + body + cta），且**结尾引导不能按比例
# 跟着短时长一起放大**：审查报告 P2-26 算的是 15 秒档原本 cta 15 字 ≈ 3.2 秒，
# 一条 15 秒的片子里花五分之一时间在念 CTA，而正文只剩 40 字（8 秒）说一件事。
# 短档的正确形状是"钩子重、引导轻"：引导压到 8 字（"关注我，下期讲 XX"），
# 省下的字数全部还给正文。60 秒及以上不动（长片有空间铺陈引导）。
quota_table:
  15:  { total: 70,  hook: 15, body: 47,  cta: 8 }
  30:  { total: 145, hook: 25, body: 90,  cta: 30 }
  60:  { total: 290, hook: 45, body: 190, cta: 55 }
  90:  { total: 430, hook: 60, body: 300, cta: 70 }
  180: { total: 820, hook: 90, body: 600, cta: 130 }

# 正文要点数上限
points_by_duration:
  15: 1
  30: 2
  60: 3
  90: 3
  180: 4

# 时长偏差容差（百分比）。**本包故意不设这一项**，走引擎的自适应口径：
#   ±max(10%, 3 秒 ÷ 目标时长) —— 15 秒档放宽到 ±20%、60 秒及以上是 ±10%。
# 需要覆盖时写 `duration_tolerance_pct: 15`（合法区间 0.5~100，写错会在包列表上
# 直接标成 pack_error 并拦住生成，不会带着坏值去判定）。
# 什么时候该覆盖：某档配额物理上装不下必需的内容量（审查报告 P2-27 的 15 秒档），
# 或者反过来 —— 这个行业的成片对时长特别敏感，要收得比 10% 更紧。

# 参数值 → 知识文件章节标题关键词（按需切片注入，不全量加载）
topics_map:
  整机改造: 老旧电梯更新
  维保: 维保
  旧楼加装: 旧楼加装
  家用电梯: 家用电梯
  扶梯: 自动扶梯
  零部件: 零部件
  检验检测: 检验检测
  行业观察: 行业趋势
  通用: 安全科普

audience_map:
  业主乘客: 业主乘客
  物业业委会: 物业 / 业委会
  维保公司: 维保公司
  开发商总包: 开发商 / 总包
  经销商渠道: 经销商 / 渠道

# 各阶段注入文件由 skill.yaml 的 stages.<阶段>.files 决定（P0-18：
# 引擎只消费 private，files.select/write/compliance/facts 曾是永不注入的孤儿）。
# 这里只声明引擎真正读取的 private。
files:
  private: [private/products.yaml, private/service.yaml, private/cases.yaml, private/faq.yaml]

banwords: banwords.yaml

# ── 情报源（需求方案 §2.2）──────────────────────────────────────
# **一处声明、四处一致**：① 选题页的分区（`label · role` + 组内卡片）；
# ② 筛选行的 chip 与计数（只列 enabled 且有货的）；③ 左栏 nav 的计数；
# ④ 情报源页那张表（id / role / cadence / 接入 / 上次 / 命中）。
# 渲染层**一个平台名都不写死** —— 换行业包时这四处自动跟着变。
#
# `id` 是**引擎侧的适配器名**（app/intel.py 的 ADAPTERS），写错不会报错，
# 只会让这个源永远 0 条 —— 引擎会把它记进 param_audit 摊到界面上。
# `enabled: false` 的源照常下发，界面据此显示「未接入 N」与原因（是**决定**，不是 bug）。
#
# 实测结论（别重复调研）：泛热榜对垂直行业覆盖接近零（三平台 130 条命中 0），
# 所以热榜的价值只在"行业词偶尔真上了榜"这个破圈信号，命中 0 是**正常结果**；
# 政策库不是雷达是口径库（存量 10 份、最新一份距今 466 天），它给的是可引的文号；
# **下拉词才是雷达**（10 个种子扩散出 102 条真实问句、噪声 0）。
intel_sources:
  - id: demand_terms
    label: 下拉词
    platform: 百度/必应
    role: 雷达
    cadence: daily
    note: 搜索联想词 diff，比政策文件滞后出现 —— 那才是「正在办、正卡壳」
  - id: bilibili_search
    label: B站同类
    platform: B站
    role: 供给度量
    cadence: on_demand
    note: 公开搜索字段：播放 / 点赞 / 发布日期；计数只当相对值
  - id: hot_board
    label: 抖音热榜
    platform: 抖音
    role: 破圈触发器
    cadence: daily
    params: { board: douyin, match: keyword }
    note: 只做关键词命中；命中「困人 / 伤亡」强制走权威科普档
  - id: hot_board
    label: 头条
    platform: 头条
    role: 破圈触发器
    cadence: daily
    params: { board: toutiao, match: keyword }
    note: 已接入，多数时候今日无行业命中
  - id: hot_board
    label: 知乎
    platform: 知乎
    role: 破圈触发器
    cadence: daily
    params: { board: zhihu, match: keyword }
    note: 已接入，多数时候今日无行业命中
  - id: policy_library
    label: 政策库
    platform: 国务院
    role: 口径库
    cadence: quarterly
    note: 不是雷达是口径库：库内最新一份距今 466 天。它给的是可引的文号与条款
  - id: manual_import
    label: 人工导入
    platform: 本地
    role: 数据源
    cadence: on_demand
    note: 拿不到的平台（小红书 / 协会资讯）贴链接或导 CSV，落 data_dir/intel/elevator/manual/
  - id: xhs_board
    label: 小红书
    platform: 小红书
    role: 破圈触发器
    cadence: "—"
    enabled: false
    note: 未接入：没有可用公开榜，要 x-s 签名逆向 —— 不做（要它的内容请走「人工导入」）
