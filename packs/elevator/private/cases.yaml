# 完工案例库
#
# 案例是转化率最高的素材 —— 具体的小区、台量、时间，比任何形容词都有说服力。
#
# ⚠️ 填之前确认：项目名称是否允许对外提及？
#    public: false 的条目，脚本中只写"XX市某小区"，不出现真实名称。
#
# 当前为空：没有真实完工案例时保持空列表（2026-09-21 已删掉"示例：XX花园"
# 空壳——它只剩 type/public 两个字段，被引擎当"真案例"注入，模型据此编交付业绩）。
# 有真实项目后按下面的结构各加一条，数字必须真实可核查。

cases:

# ── 案例使用规则 ──────────────────────────
usage_rules:
  - public 为 false 时，脚本中用"XX市某小区"代替真实名称
  - 案例必须真实，不得虚构台量、年份、小区名
  - 涉及具体数据时，脚本中需保留可核查性
  - 竞品替换场景的案例，不得点名原品牌
