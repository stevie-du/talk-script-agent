# 客户常见异议与标准应答
#
# 用途：评论区回复、脚本中预埋答疑、销售话术统一口径
# ⚠️ 应答中不得出现极限词和无法兑现的承诺（见 compliance/ad-law.md）

objections:

  # ── 价格类 ──────────────────────────────
  - category: 价格
    question: "你们比别人贵"
    answer: ""
    note: "不贬低同行。转向构成拆解：设备、安装、土建、管线、后期运维分别是什么"

  - category: 价格
    question: "能不能再便宜点"
    answer: ""
    note: "可换成增加服务或延长质保，不要直接让价"

  - category: 价格
    question: "后期维护贵不贵"
    answer: ""
    note: "给周期和构成：维保费、年检费、电费、易损件更换"

  # ── 工期类 ──────────────────────────────
  - category: 工期
    question: "装多久，会不会影响出行"
    answer: ""
    note: "给阶段划分，说明居民临时通行方案"

  - category: 工期
    question: "能不能快一点"
    answer: ""
    note: "说明哪些环节不能压缩（结构鉴定、审批、养护期），不承诺违规赶工"

  # ── 安全类 ──────────────────────────────
  - category: 安全
    question: "电梯会不会掉下去"
    answer: "讲多重保护：抱闸、限速器与安全钳联动、缓冲器。不做绝对承诺"
    note: "统一口径见 compliance/industry.md 反谣言库"

  - category: 安全
    question: "加装会不会影响楼体安全"
    answer: "说明需先做结构鉴定，合格后才施工"
    note: "不做'绝对没问题'承诺"

  - category: 安全
    question: "家用电梯要不要年检"
    answer: ""
    note: "涉及监管属性界定，发布前核实当地口径，不确定时用中性表述"

  # ── 资质与验收 ──────────────────────────
  - category: 资质
    question: "你们有资质吗"
    answer: ""
    note: "写清许可证类别与覆盖范围，不夸大成'什么都能干'"

  - category: 资质
    question: "验收能过吗"
    answer: "配合完成检验前的整改与资料准备"
    note: "❌ 严禁'包过''保证通过'"

  # ── 售后类 ──────────────────────────────
  - category: 售后
    question: "坏了多久能到"
    answer: ""
    note: "填 private/service.yaml 的真实响应时效，写不到的不要写"

  - category: 售后
    question: "保修多久，保什么"
    answer: ""
    note: "写清年限和范围，同时说明不保范围，避免后期纠纷"

  - category: 售后
    question: "以后维保是不是你们做"
    answer: ""
    note: "明确交接节点和责任主体"

  # ── 政策类（加装）────────────────────────
  - category: 政策
    question: "有补贴吗，能补多少"
    answer: "符合条件的老旧小区可申请财政补助，具体标准和流程以当地政策为准"
    note: "❌ 严禁'政府扶持''官方补贴'，属权威冒用"

  - category: 政策
    question: "一楼不同意怎么办"
    answer: ""
    note: "讲沟通机制与补偿方案思路，不站队、不激化对立"

  - category: 政策
    question: "需要多少户同意"
    answer: ""
    note: "各地表决规则不同，引导查询当地规定，不给统一数字"

  # ── 技术选型 ────────────────────────────
  - category: 技术
    question: "我家能不能装"
    answer: "先看底坑深度和顶层高度这两个硬条件"
    note: "引导到勘测环节"

  - category: 技术
    question: "曳引和螺杆选哪个"
    answer: ""
    note: "讲适用条件，不说'哪个最好'（极限词）"
