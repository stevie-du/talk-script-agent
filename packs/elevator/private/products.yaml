# 产品型号与参数库
#
# 填写说明：
#   1. 带单位的必须写单位（kg / m/s / mm / 度）
#   2. 不确定就留空，不要用估计值
#   3. 每项填完更新 verified 日期
#   4. 示例条目请整条替换，不要只在示例上改数字
#
# 只需填你实际在卖的品类，用不到的分组可整段删除
#
# ⚠ 2026-09-20：示例条目里的数字（1050kg / 1.75m/s 等）已全部清空 ——
#   它们曾作为「很像真的」事实注入提示词，模型据此编出交付业绩（P0-17）。
#   现在字段只留注释，不预填任何「像真数据」的值。

# ── 乘客电梯 ──────────────────────────────
passenger:
  - brand: ""
    model: ""
    rated_load_kg:              # 额定载重
    speed_ms:                   # 额定速度
    max_stops:                  # 最大层站数
    max_travel_m:               # 最大提升高度
    machine_room: ""            # 有机房 / 无机房 / 小机房
    drive: ""                   # 驱动方式
    door_type: ""               # 中分 / 旁开 / 双折
    door_width_mm:              # 门宽
    car_size_mm: ""             # 宽×深
    control: ""                 # 控制方式
    highlights:                 # 卖点，每条要能落到具体装置或数据
      - ""
    applicable: ""              # 住宅 / 写字楼 / 酒店
    source: ""
    verified: ""

# ── 自动扶梯 / 人行道 ─────────────────────
escalator:
  - brand: ""
    model: ""
    rise_m:                     # 提升高度
    angle_deg:                  # 30 / 35
    step_width_mm:              # 600 / 800 / 1000
    speed_ms:                   # 额定速度
    indoor_outdoor: ""          # 室内 / 室外（室外需注明防护等级）
    highlights:
      - ""
    applicable: ""
    source: ""
    verified: ""

# ── 家用电梯（别墅梯）──────────────────────
home:
  - brand: ""
    model: ""
    drive: ""                   # 曳引 / 螺杆 / 液压
    rated_load_kg:              # 额定载重
    speed_ms:                   # 额定速度
    min_pit_mm:                 # 最小底坑，无底坑方案填 0
    min_headroom_mm:            # 最小顶层高度
    shaft_size_mm: ""           # 最小井道尺寸 宽×深
    door_type: ""               # 自动中分 / 手拉门 / 平开门
    power: ""                   # 220V 家用电源 / 是否需三相电
    highlights:
      - ""
    source: ""
    verified: ""

# ── 载货电梯 ──────────────────────────────
freight:
  - brand: ""
    model: ""
    rated_load_kg:              # 额定载重
    speed_ms:                   # 额定速度
    car_size_mm: ""
    door_type: ""               # 双折旁开等
    control: ""
    highlights:
      - ""
    source: ""
    verified: ""

# ── 加装 / 更新方案 ───────────────────────
modernization:
  - name: ""
    shaft_type: ""              # 钢结构 / 混凝土
    entry: ""                   # 平层入户 / 半层入户
    applicable_floors: ""
    cycle_days:                 # 施工周期
    notes: ""
    source: ""
    verified: ""